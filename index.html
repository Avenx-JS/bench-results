<!doctype html>
<html lang="en">
<head>
    <title>Avenx Benchmark Report</title>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            height: 100%;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #333;
            background-color: #fff;
        }
        .wrapper {
            min-height: 100%;
        }
        .pad1 {
            padding: 10px;
        }
        h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 400;
        }
        .clearfix:after {
            content: '';
            display: block;
            height: 0;
            clear: both;
            visibility: hidden;
        }
        .fl { float: left; }
        .pad1y { padding: 10px 0; }
        
        .stats-container {
            margin: 10px 0;
        }
        .stat-box {
            padding-right: 20px;
        }
        .strong {
            font-weight: bold;
            display: block;
            font-size: 120%;
        }
        .quiet {
            color: rgba(0,0,0,0.5);
            font-size: 12px;
        }

        .chart-container {
            margin-top: 20px;
            padding: 15px;
            background: #fafafa;
            border: 1px solid #eee;
        }

        table.coverage-summary {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 0 0;
            border: 1px solid #d1d5da;
        }
        table.coverage-summary th {
            background-color: #f6f8fa;
            border-bottom: 1px solid #d1d5da;
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: #586069;
        }
        table.coverage-summary td {
            padding: 8px 10px;
            border-bottom: 1px solid #e1e4e8;
            font-family: Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 12px;
        }
        table.coverage-summary tr:nth-child(even) {
            background-color: #fcfcfc;
        }
        table.coverage-summary tr:hover {
            background-color: #f1f8ff;
        }

        .ops-value {
            color: #22863a;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            padding: 10px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
        }
        a { color: #0074D9; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class='wrapper'>
    <div class='pad1'>
        <h1>Avenx Framework Benchmarks</h1>
        <div class='clearfix stats-container' id="summaryBoxes">
            <!-- Stats boxes will be injected here -->
        </div>
        <p class="quiet">
            Performance metrics gathered from local environment. Higher Ops/sec indicates better performance.
        </p>
    </div>
    
    <div class='pad1'>
        <div class="chart-container">
            <canvas id="opsChart" height="250"></canvas>
        </div>
    </div>

    <div class='pad1'>
        <table class="coverage-summary">
            <thead>
                <tr>
                   <th>Benchmark Target</th>
                   <th>Ops / sec</th>
                   <th>Avg Latency</th>
                   <th>Sample Size</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be injected here -->
            </tbody>
        </table>
    </div>

    <footer>
        Benchmark report generated by <a href="https://github.com/avenx-js/avenx-js" target="_blank">Avenx-Bench</a> at <span id="footerDate"></span>
    </footer>
</div>

<script>
    async function init() {
        try {
            const res = await fetch('results.json');
            const data = await res.json();
            
            const date = new Date(data[0].timestamp);
            document.getElementById('footerDate').textContent = date.toString();

            renderSummary(data);
            renderChart(data);
            renderTable(data);
        } catch (e) {
            console.error(e);
            document.querySelector('.pad1').innerHTML = '<h1 style="color:red">ERROR: FAILED_TO_LOAD_RESULTS</h1>';
        }
    }

    function renderSummary(data) {
        const container = document.getElementById('summaryBoxes');
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'fl pad1y stat-box';
            div.innerHTML = `
                <span class="strong">${item.ops.toLocaleString()}</span>
                <span class="quiet">Ops/s (${item.name})</span>
            `;
            container.appendChild(div);
        });
    }

    function renderChart(data) {
        const ctx = document.getElementById('opsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(d => d.name),
                datasets: [{
                    data: data.map(d => d.ops),
                    backgroundColor: '#0366d6',
                    maxBarThickness: 50
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f0f0f0' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.file}</td>
                <td class="ops-value">${item.ops.toLocaleString()}</td>
                <td>${item.avgTime.toFixed(4)} ms</td>
                <td>1000 iterations</td>
            `;
            tbody.appendChild(tr);
        });
    }

    init();
</script>
</body>
</html>
